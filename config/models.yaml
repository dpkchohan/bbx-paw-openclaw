# =============================================================================
# BBX PAW — 4-Tier Model Strategy
# =============================================================================
# Consumed by:
#   - config/openclaw.config.js   -> generates the amazon-bedrock provider
#                                     block in ~/.openclaw/openclaw.json
#   - workflows/trigger-jobs/openclaw-task.js
#                                  -> maps a job's requested "tier" to a
#                                     concrete model id sent via the
#                                     x-openclaw-model header on the
#                                     Gateway's OpenAI-compatible endpoint.
#
# All four tiers run on Amazon Bedrock (native Converse API, provider id
# "amazon-bedrock") — a single AWS-credentials-only setup, no other API keys.
#
# Tier 2 (GPT-5.6 Luna) note: GPT-5.6 Luna is OpenAI's model hosted directly
# in Bedrock's own model catalog (vendor prefix "openai."), NOT via the
# separate Bedrock Mantle provider. Bedrock Mantle (OpenClaw provider id
# "amazon-bedrock-mantle") is a distinct, OpenAI-compatible /v1 surface that
# hosts GPT-OSS/Qwen/Kimi/GLM plus a few Claude models through a bearer-token
# route — Luna does not need it because it already has a first-class Bedrock
# Converse API model id and inference profile. Confirmed via AWS Bedrock
# console (model catalog + inference profile pages), account 834474891352,
# us-east-1:
#   Base model id:       openai.gpt-5.6-luna
#   Inference profile:    global.openai.gpt-5.6-luna
#   Profile ARN:          arn:aws:bedrock:us-east-1:834474891352:inference-profile/global.openai.gpt-5.6-luna
#   Regions:               us-east-1, us-east-2, us-west-2
#   Context window:        272,000 tokens
#   Pricing:               $0.22 / 1M input tokens, $1.32 / 1M output tokens
# Use the "global." cross-region inference profile id (not the bare
# "openai.gpt-5.6-luna" base model id) when invoking it, exactly like
# tier4_critical's "global.anthropic.claude-sonnet-5" cross-region profile.
#
# NOTES / CAVEATS (read before deploying):
#   - Bedrock model ids sometimes require a region or cross-region
#     inference-profile prefix (e.g. "us." or "global."). tier2_default and
#     tier4_critical use the "global." cross-region profile prefix; confirm
#     exact availability for your account/region with `openclaw models list`
#     (or `aws bedrock list-foundation-models` / `list-inference-profiles`)
#     before go-live.
# =============================================================================

version: 3

tiers:
  tier1_cheap:
    label: "Tier 1 - Cheap tasks"
    name: "Amazon Nova Pro"
    provider: bedrock
    model: us.amazon.nova-pro-v1:0
    inputCostPerMillionTokensUsd: 0.80
    outputCostPerMillionTokensUsd: 3.20
    contextWindow: 300000
    maxTokens: 4096
    reasoning: false
    use:
      - classification
      - extraction
      - simple-qa
      - routing / triage

  tier2_default:
    label: "Tier 2 - Default worker"
    name: "GPT-5.6 Luna"
    provider: bedrock
    model: global.openai.gpt-5.6-luna
    inputCostPerMillionTokensUsd: 0.22
    outputCostPerMillionTokensUsd: 1.32
    contextWindow: 272000
    maxTokens: 8192
    reasoning: false
    use:
      - general chat
      - background job default
      - summarization

  tier3_coding:
    label: "Tier 3 - Coding / analysis"
    name: "Claude Sonnet 4.5"
    provider: bedrock
    model: anthropic.claude-sonnet-4-5-20250929-v1:0
    inputCostPerMillionTokensUsd: 2.00
    outputCostPerMillionTokensUsd: 10.00
    contextWindow: 200000
    maxTokens: 8192
    reasoning: true
    use:
      - code generation
      - code review
      - data analysis

  tier4_critical:
    label: "Tier 4 - Critical tasks"
    name: "Claude Sonnet 5"
    provider: bedrock
    model: global.anthropic.claude-sonnet-5
    inputCostPerMillionTokensUsd: 2.00
    outputCostPerMillionTokensUsd: 10.00
    contextWindow: 200000
    maxTokens: 8192
    reasoning: true
    use:
      - high-stakes decisions
      - long-running autonomous research
      - final review before delivery to user

# Tier used when a Trigger.dev job payload omits `tier`.
defaultTier: tier2_default

