# =============================================================================
# BBX PAW — 4-Tier Model Strategy
# =============================================================================
# Consumed by:
#   - config/openclaw.config.js   -> generates the amazon-bedrock / openai
#                                     provider blocks in ~/.openclaw/openclaw.json
#   - workflows/trigger-jobs/openclaw-task.js
#                                  -> maps a job's requested "tier" to a
#                                     concrete model id sent via the
#                                     x-openclaw-model header on the
#                                     Gateway's OpenAI-compatible endpoint.
#
# Tier keys below (tier1_cheap, tier2_default, tier3_coding, tier4_critical)
# and each tier's `model` / `provider` / `base_url` fields are the confirmed,
# literal values for this deployment. `provider: bedrock` maps to OpenClaw's
# real provider id `amazon-bedrock`; `provider: openai` maps to OpenClaw's
# built-in `openai` provider (authenticated via OPENAI_API_KEY, see
# .env.example).
#
# NOTES / CAVEATS (read before deploying):
#   - AWS Bedrock does not host OpenAI models. Tier 2 (GPT-5.6 Luna) is
#     therefore served directly by the official OpenAI API
#     (https://api.openai.com/v1), not Bedrock — this is why tier2_default
#     is the only tier with `provider: openai` and a `base_url`.
#   - "gpt-5.6-luna" is not (yet) a publicly documented OpenAI model id as
#     of this writing. Confirm the exact model string available on your
#     OpenAI account/plan and update tier2_default.model if it differs.
#   - Bedrock model ids sometimes require a region or cross-region
#     inference-profile prefix (e.g. "us." or "global."). tier4_critical
#     uses the "global." cross-region profile prefix for Claude Sonnet 5;
#     confirm exact availability for your account/region with
#     `openclaw models list` (or `aws bedrock list-foundation-models`)
#     before go-live.
# =============================================================================

version: 2

tiers:
  tier1_cheap:
    label: "Tier 1 - Cheap tasks"
    provider: bedrock
    model: us.amazon.nova-pro-v1:0
    costPerMillionTokensUsd: 0.80
    contextWindow: 300000
    maxTokens: 4096
    reasoning: false
    use:
      - classification
      - extraction
      - simple-qa
      - routing / triage

  tier2_default:
    label: "Tier 2 - Default worker"
    provider: openai
    model: gpt-5.6-luna
    base_url: https://api.openai.com/v1
    costPerMillionTokensUsd: 0.22
    contextWindow: 128000
    maxTokens: 8192
    reasoning: false
    use:
      - general chat
      - background job default
      - summarization

  tier3_coding:
    label: "Tier 3 - Coding / analysis"
    provider: bedrock
    model: anthropic.claude-sonnet-4-5-20250929-v1:0
    costPerMillionTokensUsd: 2.00
    contextWindow: 200000
    maxTokens: 8192
    reasoning: true
    use:
      - code generation
      - code review
      - data analysis

  tier4_critical:
    label: "Tier 4 - Critical tasks"
    provider: bedrock
    model: global.anthropic.claude-sonnet-5
    costPerMillionTokensUsd: 2.00
    contextWindow: 200000
    maxTokens: 8192
    reasoning: true
    use:
      - high-stakes decisions
      - long-running autonomous research
      - final review before delivery to user

# Tier used when a Trigger.dev job payload omits `tier`.
defaultTier: tier2_default
