# =============================================================================
# BBX PAW OpenClaw Integration — docker-compose.yaml
# =============================================================================
# Deploy target: Coolify, same EC2 host as BBX Chat, as a separate container.
# Coolify reads this file directly (Docker Compose deployment type) and
# injects the environment variables you configure in its UI, which map to the
# ${VAR} references below (see .env.example for the full list).
# =============================================================================

services:
  openclaw:
    build: &openclaw-build .
    image: &openclaw-image ${OPENCLAW_IMAGE:-bbx-paw-openclaw:local}
    container_name: bbx-paw-openclaw
    restart: unless-stopped
    init: true
    env_file: &openclaw-env-file
      - path: .env
        required: false
    environment: &openclaw-environment
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      WORKSPACE_PATH: /home/node/.openclaw/workspace
      OPENCLAW_PORT: ${OPENCLAW_PORT:-18789}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_TRUSTED_PROXIES: ${OPENCLAW_TRUSTED_PROXIES:-}
      OPENCLAW_TZ: ${OPENCLAW_TZ:-UTC}
      # Deliberately EMPTY for the openclaw (Gateway) service. This anchor is
      # shared with the mcp sidecar, which does need
      # OPENCLAW_GATEWAY_URL=http://openclaw:18789 -- see the mcp service's
      # override below. But inside the Gateway container itself, a non-empty
      # OPENCLAW_GATEWAY_URL makes every `openclaw` CLI/agent call in that
      # container (Coolify terminal, entrypoint, system-agent inference
      # probe) treat the Gateway as a REMOTE one and abort with
      # "SECURITY ERROR: Gateway URL http://openclaw:18789 uses plaintext
      # ws:// to a non-loopback address". Result: the system agent's
      # inference probe fails in ~7ms ("setup_inference_probe_failed") and
      # surfaces as SystemAgentInferenceUnavailableError even though Bedrock
      # itself is healthy. `environment:` takes precedence over `env_file:`,
      # so this also neutralises OPENCLAW_GATEWAY_URL coming from the
      # Coolify-written .env, which the mcp sidecar legitimately needs.
      OPENCLAW_GATEWAY_URL: ""
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      MODEL_CHEAP: ${MODEL_CHEAP:-us.amazon.nova-pro-v1:0}
      MODEL_DEFAULT: ${MODEL_DEFAULT:-global.openai.gpt-5.6-luna}
      MODEL_CODING: ${MODEL_CODING:-anthropic.claude-haiku-4-5-20241022-v1:0}
      MODEL_CRITICAL: ${MODEL_CRITICAL:-global.anthropic.claude-sonnet-5}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-bbx_chat}
      MONGO_PAW_JOBS_COLLECTION: ${MONGO_PAW_JOBS_COLLECTION:-paw_jobs}
    volumes: &openclaw-volumes
      # Bind-mount host directories for persistent OpenClaw state, workspace
      # files, and auth secrets. These are intentionally host bind mounts
      # (not named Docker volumes) so their contents stay directly browsable
      # on the host and survive `docker compose down` without extra steps.
      #
      # Runtime permission fix: bind mounts always take on the *host*
      # directory's ownership when Docker auto-creates them (typically
      # root:root on Coolify/Linux hosts), which crashed the unprivileged
      # `node` user with EACCES writing openclaw.json/session state. The
      # container now starts as root and self-heals ownership of these
      # exact paths (docker/entrypoint.sh chowns them to node:node) before
      # dropping privileges via gosu and exec'ing the actual OpenClaw
      # process — so it's safe for these host directories to start out
      # owned by any user, including root.
      - "${OPENCLAW_CONFIG_DIR:-./.openclaw}:/home/node/.openclaw"
      - "${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/node/.openclaw/workspace"
      - "${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-./.openclaw-auth-profile-secrets}:/home/node/.config/openclaw"
    ports:
      - "18789:18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /startupz, not /readyz: /readyz returns 503 whenever ANY configured
      # channel (e.g. WhatsApp) is unhealthy, which makes Coolify/Traefik
      # drop the whole app ("No available server") even though the Gateway
      # is fine. /startupz does not consult channel health.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/startupz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # Coolify reverse-proxy hints; adjust the domain in the Coolify UI.
      - "coolify.managed=true"

  mcp:
    build: *openclaw-build
    image: *openclaw-image
    container_name: bbx-paw-openclaw-mcp
    command: ["npm", "run", "mcp:server"]
    depends_on:
      - openclaw
    restart: unless-stopped
    init: true
    env_file: *openclaw-env-file
    environment:
      <<: *openclaw-environment
      # The MCP sidecar reaches the Gateway over the compose network, so it
      # (unlike the Gateway container itself) needs the service URL. Must
      # not fall back to loopback: 127.0.0.1 would be the mcp container.
      # Deliberately a LITERAL, not ${OPENCLAW_GATEWAY_URL:-...}: Coolify
      # injects any variable referenced with ${...} (using its stored UI
      # value) into every service, which re-adds the URL to the Gateway
      # container and breaks the system agent's inference probe. Do not
      # define OPENCLAW_GATEWAY_URL in the Coolify UI.
      OPENCLAW_GATEWAY_URL: "http://openclaw:18789"
    volumes: *openclaw-volumes
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "coolify.managed=true"
